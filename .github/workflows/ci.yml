name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, openssl

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Client-Tests (Python)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Repo-Prüfungen (keine Tokens, keine Geheimnisse)
        run: python3 tests/check_repo.py

      - name: JavaScript-Syntax
        run: python3 tests/check_js.py

      - name: PHP-Syntax
        run: for f in server/*.php server/tools/*.php; do php -l "$f" || exit 1; done

      - name: Server-Ende-zu-Ende (PHP + SQLite)
        run: bash tests/php/run.sh
