name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      
      - name: Run tests (if available)
        run: |
          if [ -d "tests" ] || [ -f "test_*.py" ] || [ -f "pytest.ini" ]; then
            pytest || echo "No tests found or tests failed"
          else
            echo "No test suite configured"
          fi
      
      - name: Lint with flake8 (if available)
        run: |
          if pip show flake8 > /dev/null 2>&1; then
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          else
            echo "flake8 not installed, skipping lint"
          fi
